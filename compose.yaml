services:
  postgres:
    image: postgres:18.6-alpine
    container_name: lostly-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: lostly
      POSTGRES_USER: lostly
      POSTGRES_PASSWORD: lostly_dev

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lostly -d lostly']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
