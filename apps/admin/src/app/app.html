<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar">
  <a class="brand" routerLink="/">Lostly <span>Admin</span></a>
  @if (api.user(); as user) {
    <div class="account">
      <span>{{ user.displayName }}</span
      ><button class="secondary" (click)="logout()" [disabled]="busy()">Sign out</button>
    </div>
  }
</header>
@if (api.user()?.role === 'admin') {
  <nav aria-label="Administration">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      >Dashboard</a
    >
    <a routerLink="/listings" routerLinkActive="active" ariaCurrentWhenActive="page">Listings</a>
    <a routerLink="/users" routerLinkActive="active" ariaCurrentWhenActive="page">Users</a>
    <a routerLink="/claims" routerLinkActive="active" ariaCurrentWhenActive="page">Claims</a>
  </nav>
}
<main id="main" tabindex="-1">
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
  <router-outlet />
</main>
