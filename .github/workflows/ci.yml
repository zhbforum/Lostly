name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: lostly_test
          POSTGRES_USER: lostly
          POSTGRES_PASSWORD: lostly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lostly -d lostly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Setup Node.js for Angular dev server
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Install dependencies
        run: bun ci

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck API
        working-directory: apps/api
        run: bun run typecheck

      - name: Test API
        working-directory: apps/api
        run: bun run test

      - name: Apply database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://lostly:lostly_test@localhost:5432/lostly_test
        run: bun run db:migrate

      - name: Test API integration
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://lostly:lostly_test@localhost:5432/lostly_test
        run: bun run test:integration

      - name: Build web application
        working-directory: apps/web
        run: bun run build

      - name: Test web application
        working-directory: apps/web
        run: bun run test

      - name: Build admin application
        working-directory: apps/admin
        run: bun --bun run build

      - name: Test admin application
        working-directory: apps/admin
        run: bun --bun run test --watch=false

      - name: Install browsers for E2E
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Test browser flow
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://lostly:lostly_test@localhost:5432/lostly_test
        run: bun run test:e2e

      - name: Test responsive messages UI
        working-directory: apps/web
        run: bun run test:e2e:ui

      - name: Test admin browser flow
        working-directory: apps/admin
        env:
          DATABASE_URL: postgresql://lostly:lostly_test@localhost:5432/lostly_test
        run: bun run test:e2e
